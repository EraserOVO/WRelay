name: Sign and publish Windows release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  build-sign-publish:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - name: Prepare draft release and confirm matching version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Run this workflow from a version tag such as v0.4.0"
          }
          $tag = $env:GITHUB_REF_NAME
          $project = Get-Content pyproject.toml -Raw
          if ($project -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "Project version not found" }
          $version = $Matches[1]
          if ($version -ne $tag.Substring(1)) { throw "Git tag and project version do not match" }

          $isDraft = gh release view $tag --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            $changelog = Get-Content CHANGELOG.md -Raw
            $notesPattern = "(?ms)^##\s+$([regex]::Escape($version))\s*\r?\n(.*?)(?=^##\s|\z)"
            $notesMatch = [regex]::Match($changelog, $notesPattern)
            if (-not $notesMatch.Success) { throw "Release notes for version $version were not found in CHANGELOG.md" }

            $notesPath = Join-Path $env:RUNNER_TEMP "release-notes-$version.md"
            [IO.File]::WriteAllText($notesPath, $notesMatch.Groups[1].Value.Trim() + "`n", [Text.UTF8Encoding]::new($false))
            gh release create $tag --draft --verify-tag --title "WRelay $version" --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw "Could not create a draft GitHub Release for $tag" }

            $isDraft = gh release view $tag --json isDraft --jq .isDraft
            if ($LASTEXITCODE -ne 0) { throw "Could not verify the draft GitHub Release for $tag" }
          }
          if ($isDraft -ne 'true') { throw "The existing GitHub Release for $tag must be a draft before signing" }

      - name: Prepare bundled runtime
        shell: pwsh
        run: .\scripts\prepare_runtime.ps1

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Prepare compiler environment
        shell: pwsh
        run: |
          python -m venv .runtime\compile-env
          .\.runtime\compile-env\Scripts\python.exe -m pip install -r requirements-lock.txt -r requirements-build.txt

      - name: Build unsigned release installer
        shell: pwsh
        run: .\scripts\build_installer.ps1 -Edition release -Unsigned

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $project = Get-Content pyproject.toml -Raw
          if ($project -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "Project version not found" }
          "value=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload unsigned installer for signing
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wrelay-installer-${{ github.ref_name }}
          path: dist/WRelay-Setup.exe
          if-no-files-found: error
          archive: false

      - name: Submit to SignPath and wait for approval
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          output-artifact-directory: signed
          skip-decompress: true
          parameters: |
            version: "${{ steps.version.outputs.value }}"

      - name: Verify signature and prepare checksum
        shell: pwsh
        run: |
          $signedInstaller = Get-ChildItem signed -Filter WRelay-Setup.exe -Recurse | Select-Object -First 1
          if (-not $signedInstaller) { throw "SignPath did not return WRelay-Setup.exe" }
          $signature = Get-AuthenticodeSignature -LiteralPath $signedInstaller.FullName
          if ($signature.Status -ne 'Valid') { throw "Installer Authenticode signature is $($signature.Status)" }
          if ($signature.SignerCertificate.Subject -notmatch 'SignPath Foundation') {
            throw "Installer was not signed by the expected SignPath Foundation publisher"
          }
          Copy-Item -LiteralPath $signedInstaller.FullName -Destination dist/WRelay-Setup.exe -Force
          $hash = (Get-FileHash dist/WRelay-Setup.exe -Algorithm SHA256).Hash
          "$hash  WRelay-Setup.exe" | Set-Content -LiteralPath dist/WRelay-Setup.sha256 -Encoding ascii

      - name: Add signing policy to release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $body = gh release view $tag --json body --jq .body
          if ($body -notmatch 'CODE_SIGNING_POLICY\.md') {
            $body = $body.TrimEnd() + "`n`nCode signing policy: https://github.com/EraserOVO/WRelay/blob/main/CODE_SIGNING_POLICY.md`n"
            $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            [IO.File]::WriteAllText($notes, $body, [Text.UTF8Encoding]::new($false))
            gh release edit $tag --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "Could not add the code signing policy to the release notes" }
          }

      - name: Publish signed installer and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload $env:GITHUB_REF_NAME dist/WRelay-Setup.exe dist/WRelay-Setup.sha256 --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload signed release assets" }
          gh release edit $env:GITHUB_REF_NAME --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the signed GitHub Release" }
