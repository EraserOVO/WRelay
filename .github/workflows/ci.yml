name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt -e .
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
      - name: Compile source
        run: python -m compileall -q bot.py plugins panel scripts
      - name: Run regression suite
        run: python -u scripts/run_tests.py

  installer-smoke:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare bundled runtime
        shell: pwsh
        run: .\scripts\prepare_runtime.ps1

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Prepare compiler environment
        shell: pwsh
        run: |
          python -m venv .runtime\compile-env
          .\.runtime\compile-env\Scripts\python.exe -m pip install -r requirements-lock.txt -r requirements-build.txt

      - name: Build unsigned test edition and run smoke test
        shell: pwsh
        run: |
          .\scripts\build_installer.ps1 -Edition test
          $installer = Get-ChildItem dist\WRelay-Test-*-Setup.exe | Sort-Object LastWriteTimeUtc | Select-Object -Last 1
          if (-not $installer) { throw "Test installer was not created" }
          .\.runtime\compile-env\Scripts\python.exe scripts\test_compiled_installer.py $installer.FullName --edition test --skip-desktop
