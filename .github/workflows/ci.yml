name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt -e .
      - name: Check whitespace
        run: git diff --check HEAD
      - name: Compile source
        run: python -m compileall -q bot.py plugins panel scripts
      - name: Run regression suite
        run: python -u scripts/run_tests.py
